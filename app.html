
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ruth Chavac | Psicología y Bienestar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #pagina {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        #botonMusica {
            position: fixed;
            bottom: 25px;
            left: 20px;
            z-index: 9999;
            padding: 13px 18px;
            background: #D99BAA;
            color: white;
            border: none;
            border-radius: 30px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        #botonMusica:hover {
            background: #BD758A;
        }
    </style>
</head>

<body>

    <!-- Las páginas se muestran aquí -->
    <iframe
        id="pagina"
        name="contenido"
        src="index.html"
        title="Contenido de Ruth Chavac">
    </iframe>

    <!-- Reproductor permanente -->
    <audio id="musicaFondo" loop preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Botón rosado -->
    <button id="botonMusica" type="button">
        ♪ Activar música
    </button>

    <script>
        const musica = document.getElementById("musicaFondo");
        const boton = document.getElementById("botonMusica");

        musica.volume = 0.25;

        boton.addEventListener("click", async () => {
            if (musica.paused) {
                try {
                    await musica.play();
                    boton.textContent = "♫ Pausar música";
                } catch (error) {
                    console.error(error);
                }
            } else {
                musica.pause();
                boton.textContent = "♪ Activar música";
            }
        });

        // Mantener los enlaces internos dentro del iframe
        const pagina = document.getElementById("pagina");

        pagina.addEventListener("load", () => {
            try {
                const doc = pagina.contentDocument;

                if (!doc) return;

                doc.addEventListener("click", (evento) => {
                    const enlace = evento.target.closest("a[href]");

                    if (!enlace) return;

                    const url = new URL(enlace.href);

                    if (
                        url.origin === location.origin &&
                        url.pathname.endsWith(".html") &&
                        !enlace.hasAttribute("download") &&
                        enlace.target !== "_blank"
                    ) {
                        evento.preventDefault();
                        pagina.src = url.href;
                    }
                });
            } catch (error) {
                console.error(error);
            }
        });
    </script>

</body>
</html>
